<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Shailesh Sethi developer card</title>
  <desc id="desc">An animated developer identity card showing Shailesh's role and creative technology focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030705"/><stop offset=".55" stop-color="#07140e"/><stop offset="1" stop-color="#050812"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43ff78"/><stop offset=".5" stop-color="#35d8ff"/><stop offset="1" stop-color="#b693ff"/></linearGradient>
    <radialGradient id="avatar"><stop stop-color="#43ff78" stop-opacity=".22"/><stop offset="1" stop-color="#43ff78" stop-opacity=".02"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#43ff78" opacity=".1"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}.spin2{animation:spin 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}
      .pulse{animation:pulse 2s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.bar1{animation:bar1 4s ease-in-out infinite}.bar2{animation:bar2 4s .5s ease-in-out infinite}.bar3{animation:bar3 4s 1s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(360px)}}
      @keyframes bar1{50%{width:126px}}@keyframes bar2{50%{width:92px}}@keyframes bar3{50%{width:138px}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <clipPath id="card"><rect width="900" height="320" rx="22"/></clipPath>
  </defs>
  <rect width="900" height="320" rx="22" fill="url(#bg)"/><rect x="1.5" y="1.5" width="897" height="317" rx="20.5" fill="none" stroke="url(#edge)" stroke-width="3"/><rect width="900" height="320" rx="22" fill="url(#dots)"/>
  <g clip-path="url(#card)"><rect class="scan" width="900" height="46" fill="url(#edge)" opacity=".025"/></g>
  <path d="M294 35v250" stroke="#43ff78" opacity=".15"/>
  <g transform="translate(54 54)">
    <circle cx="92" cy="92" r="88" fill="url(#avatar)" stroke="#43ff78" opacity=".8"/>
    <circle class="spin" cx="92" cy="92" r="74" fill="none" stroke="#35d8ff" stroke-width="2" stroke-dasharray="28 14 3 12"/>
    <circle class="spin2" cx="92" cy="92" r="61" fill="none" stroke="#b693ff" stroke-dasharray="5 13" opacity=".7"/>
    <text class="sans" x="92" y="108" text-anchor="middle" font-size="50" font-weight="800" fill="#effff4">SS</text>
    <circle class="pulse" cx="162" cy="159" r="9" fill="#43ff78" filter="url(#glow)"/>
    <rect x="17" y="199" width="150" height="30" rx="15" fill="#43ff78" fill-opacity=".08" stroke="#43ff78" stroke-opacity=".5"/>
    <text class="mono" x="92" y="219" text-anchor="middle" font-size="12" fill="#43ff78">OPEN TO BUILD</text>
  </g>
  <g transform="translate(334 55)">
    <text class="mono" font-size="13" fill="#43ff78" letter-spacing="2">DEVELOPER ID // 2026</text>
    <text class="sans" y="45" font-size="34" font-weight="800" fill="#effff4">SHAILESH SETHI</text>
    <text class="mono" y="73" font-size="15" fill="#8eac9a">Creative Developer • AI Explorer • Game Builder</text>
    <g transform="translate(0 103)" class="mono" font-size="13">
      <text fill="#587061">ROLE</text><text x="102" fill="#dfffe8">OpenAI Campus Lead</text>
      <text y="34" fill="#587061">FOCUS</text><text x="102" y="34" fill="#dfffe8">AI × Games × Interaction</text>
      <text y="68" fill="#587061">BASE</text><text x="102" y="68" fill="#dfffe8">India / Internet</text>
      <text y="102" fill="#587061">MODE</text><text x="102" y="102" fill="#43ff78">● SHIPPING</text>
    </g>
    <g transform="translate(365 104)">
      <text class="mono" font-size="11" fill="#587061">CREATIVE SIGNAL</text>
      <rect y="16" width="145" height="5" rx="2.5" fill="#173021"/><rect class="bar1" y="16" width="104" height="5" rx="2.5" fill="#43ff78"/>
      <rect y="43" width="145" height="5" rx="2.5" fill="#122b31"/><rect class="bar2" y="43" width="121" height="5" rx="2.5" fill="#35d8ff"/>
      <rect y="70" width="145" height="5" rx="2.5" fill="#251d35"/><rect class="bar3" y="70" width="86" height="5" rx="2.5" fill="#b693ff"/>
      <text class="mono" y="105" font-size="11" fill="#8eac9a">IDEA → PROTOTYPE → PLAY</text>
    </g>
  </g>
  <text class="mono" x="864" y="294" text-anchor="end" font-size="10" fill="#4d6857">AUTHENTICATED ✓</text>
</svg>
