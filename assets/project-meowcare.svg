<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="title desc">
  <title id="title">MeowCare</title><desc id="desc">An accessible remote care mobile experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030705"/><stop offset="1" stop-color="#1b1119"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff59d6" stroke-opacity=".055"/></pattern>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.heart{animation:beat 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.line{stroke-dasharray:4 9;animation:line 2.5s linear infinite}@keyframes beat{50%{transform:scale(1.15)}}@keyframes line{to{stroke-dashoffset:-26}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="560" height="240" rx="18" fill="url(#bg)"/><rect x="1.5" y="1.5" width="557" height="237" rx="16.5" fill="none" stroke="#ff59d6" stroke-opacity=".5" stroke-width="3"/><rect width="560" height="240" rx="18" fill="url(#grid)"/>
  <text class="mono" x="28" y="39" font-size="12" fill="#ff59d6">04 / ACCESSIBLE CARE</text>
  <g class="heart" transform="translate(452 110)"><path d="M0 34C-62-2-33-48 0-19 33-48 62-2 0 34z" fill="#ff59d6" fill-opacity=".16" stroke="#ff59d6" stroke-width="2"/><path d="M-38 2h21l7-14 14 31 10-17h24" fill="none" stroke="#43ff78" stroke-width="2"/></g><path class="line" d="M391 163h123" stroke="#ff59d6" stroke-width="2"/>
  <text class="sans" x="28" y="88" font-size="31" font-weight="800" fill="#effff4">MEOWCARE</text>
  <text class="sans" x="28" y="119" font-size="15" fill="#b9a0b2">A calm remote-care experience</text><text class="sans" x="28" y="140" font-size="15" fill="#b9a0b2">focused on clarity and access.</text>
  <rect x="28" y="174" width="116" height="27" rx="13.5" fill="#ff59d6" fill-opacity=".08" stroke="#ff59d6" stroke-opacity=".35"/><text class="mono" x="86" y="192" text-anchor="middle" font-size="11" fill="#ff59d6">REACT NATIVE</text>
  <rect x="152" y="174" width="68" height="27" rx="13.5" fill="#ff59d6" fill-opacity=".08" stroke="#ff59d6" stroke-opacity=".35"/><text class="mono" x="186" y="192" text-anchor="middle" font-size="11" fill="#ff59d6">UI / UX</text>
  <text class="mono" x="532" y="197" text-anchor="end" font-size="11" fill="#43ff78">BUILT WITH CARE</text>
</svg>
